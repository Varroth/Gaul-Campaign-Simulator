name: Simulator Regression Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Engine, catalogue & interface tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout simulator source
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check catalogue.js
          node --check app.js
      - name: Install test-only XML parser
        run: npm ci --ignore-scripts
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Checkout live New Recruit catalogues (read-only)
        uses: actions/checkout@v7.0.1
        with:
          repository: Varroth/Gaul-Campaign-Renegades
          path: upstream
          persist-credentials: false
      - name: Audit source catalogue XML structure
        run: python scripts/audit_upstream.py upstream
      - name: Audit Infernal Warriors default formations and weapons
        run: python scripts/audit_infernal.py upstream/Infernal_Warriors.cat
      - name: Check published Infernal Warriors roster caps and quota wording
        run: python scripts/audit_roster_rules.py upstream/Infernal_Warriors.cat
      - name: Audit named Infernal Warriors source abilities and combat coverage
        run: python scripts/audit_abilities.py upstream/Infernal_Warriors.cat
      - name: Audit source transport capacities and Bloodletter Invocation
        run: python scripts/audit_transport_reserves.py upstream/Infernal_Warriors.cat
      - name: Generate 74-unit source audit
        run: python scripts/audit_unit_matrix.py upstream/Infernal_Warriors.cat --out verification-artifacts
      - name: Exercise every imported profile and Infernal equipment branch
        run: npm run qc:catalogues -- upstream verification-artifacts
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Run browser parser, configuration and Chaplain regressions
        run: |
          python tests/browser-parser-smoke.py
          python tests/browser-config-smoke.py
          python tests/browser-cohort-smoke.py
      - name: Run desktop, mobile, sync, cache and complete battle checks
        run: python tests/browser-release-qc.py upstream
      - name: Upload quality report and browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: simulator-quality-report
          path: verification-artifacts/
          if-no-files-found: warn
          retention-days: 30
