name: Simulator Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Engine, catalogue & interface tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout simulator source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check catalogue.js
          node --check app.js
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Checkout live New Recruit catalogues (read-only)
        uses: actions/checkout@v4
        with:
          repository: Varroth/Gaul-Campaign-Renegades
          path: upstream
          persist-credentials: false
      - name: Audit source catalogue XML structure
        run: python scripts/audit_upstream.py upstream
      - name: Audit Infernal Warriors default formations and weapons
        run: python scripts/audit_infernal.py upstream/Infernal_Warriors.cat
      - name: Check published Infernal Warriors roster caps and quota wording
        run: python scripts/audit_roster_rules.py upstream/Infernal_Warriors.cat
      - name: Audit named Infernal Warriors source abilities and combat coverage
        run: python scripts/audit_abilities.py upstream/Infernal_Warriors.cat
