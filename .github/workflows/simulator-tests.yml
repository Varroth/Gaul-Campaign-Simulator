name: Simulator Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Engine and interface tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check app.js
      - name: Run regression tests
        run: node --test tests/*.test.cjs
